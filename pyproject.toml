[project]
name = "erpnext_ec"
authors = [
    { name = "Raúl Santamaría", email = "raulsantamariaobando@gmail.com" }
]
description = "ERPNext Ecuador - Localización ecuatoriana SRI"
requires-python = ">=3.12,<3.15"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "requests~=2.32",
    "urllib3~=2.7",
    "xmltodict~=0.14",
    "python-dateutil~=2.9",
    "lxml>=5.0,<7",
    "cryptography>=44",
    "python-barcode>=0.15",
]

[project.urls]
Homepage = "https://github.com/rsantamaria01/erpnext_ec"
Repository = "https://github.com/rsantamaria01/erpnext_ec"

[tool.setuptools]
packages = { find = { where = ["."], include = ["erpnext_ec*"] } }

[tool.setuptools.package-data]
"erpnext_ec" = [
    "**/*.json", "**/*.html", "**/*.js", "**/*.css", "**/*.xml", "**/*.xsd",
    "**/*.csv", "**/*.txt", "**/*.woff2", "**/*.png", "**/*.svg", "**/*.map",
    "**/*.min.js", "XadesSignerCmd",
]

[tool.setuptools.package-dir]
"" = "."

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
